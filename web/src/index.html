<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Refit</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved light/dark choice before Angular starts, so the page never flashes.
      try {
        var mode = localStorage.getItem('refit.theme') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('app-dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root>
      <div class="boot">Loading Refit…</div>
    </app-root>
  </body>
</html>
